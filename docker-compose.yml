version: "3.9"

services:
  app:
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    volumes:            # Remove later once done with development
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: mvn spring-boot:run
    depends_on:
      - ollama
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      # Model name sourced from the shared .env (OLLAMA_MODEL). This overrides
      # the value in application.yml so the app and the ollama container below
      # always request/pull the exact same model.
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_MODEL}

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pull the same model the app expects, using the shared .env value.
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL} && ollama serve"

volumes:
  ollama_data:
