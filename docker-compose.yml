services:
  app:
    # Self-contained build via the multi-stage Dockerfile: it runs
    # `mvn clean package` INSIDE the build container, downloading dependencies
    # from Maven Central. No host Maven cache or settings.xml required, so this
    # works on any machine that has Docker + internet access.
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy        # wait until the DB is ready
      ollama:
        condition: service_started
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      # Model name sourced from the shared .env (OLLAMA_MODEL). This overrides
      # the value in application.yml so the app and the ollama container below
      # always request/pull the exact same model.
      SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL: ${OLLAMA_MODEL}
      # Embedding model used to turn documents/questions into vectors for RAG.
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      # Point the app at the pgvector container (service name = hostname).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Ollama's pull/list are CLIENT commands that need a running server. So:
    #  1) start a TEMPORARY background server just to check/download the model,
    #     pulling the configured model ONLY IF it is not already present,
    #  2) stop that temporary server, then
    #  3) start the real `ollama serve` as the container's main foreground process.
    entrypoint: >
      sh -c "ollama serve &
      pid=$$!;
      until ollama list >/dev/null 2>&1; do echo 'waiting for ollama...'; sleep 1; done;
      ollama list | grep -q \"${OLLAMA_MODEL}\" || ollama pull \"${OLLAMA_MODEL}\";
      kill $$pid; wait $$pid 2>/dev/null;
      echo 'model ready, starting ollama serve...';
      exec ollama serve"

  # PostgreSQL with the pgvector extension pre-installed. Stores document
  # chunks and their embedding vectors so we can do similarity search for RAG.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Wait until Postgres is actually accepting connections before the app relies on it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  pgvector_data:
