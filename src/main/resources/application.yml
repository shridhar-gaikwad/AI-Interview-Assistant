spring:
  application:
    name: ai-interview-assistant

  ai:
    ollama:                 # Ollama local endpoint configuration
      chat:
        model: phi3.5   # default model
        options:
          temperature: 0.7  # controls creativity
          top_p: 0.9        # nucleus sampling
          max_tokens: 512   # response length
    base-url: "http://localhost:11434"

logging:
  level:
    root: INFO
    org.springframework.ai: DEBUG   # helpful to see AI interactions
